<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorar - MapStar TJ</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Leaflet Routing Machine CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        .leaflet-touch .leaflet-bar a {
            width: 44px; height: 44px; line-height: 44px;
            color: #1e293b; background-color: white;
        }
        @keyframes slideUp {
            from { transform: translate(-50%, 100%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .toast-enter { animation: slideUp 0.3s ease-out forwards; }
        .popup-enter { animation: fadeIn 0.2s ease-out forwards; }
        
        .leaflet-routing-container { display: none !important; }
        
        .suggestions-list::-webkit-scrollbar { width: 6px; }
        .suggestions-list::-webkit-scrollbar-track { background: #f1f5f9; }
        .suggestions-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="bg-slate-100 h-screen flex flex-col md:flex-row overflow-hidden">

    <!-- BARRA LATERAL (LISTA) - AHORA ES UN MODAL EN MÓVIL / SIDEBAR EN ESCRITORIO -->
    <!-- En móvil: fixed, centrado, oculto por defecto (hidden). En desktop: relativo, visible (md:flex) -->
    <aside id="sidebar-container" class="hidden md:flex flex-col bg-white z-[3000] border-slate-200 shadow-2xl md:shadow-none 
           md:w-80 md:h-full md:relative md:border-r md:translate-x-0 md:inset-auto md:rounded-none
           fixed inset-4 rounded-2xl border border-slate-200 popup-enter md:animate-none">
        
        <!-- Header de la Lista -->
        <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-white rounded-t-2xl md:rounded-none">
            <h2 class="font-bold text-slate-800 flex items-center gap-2">
                <i data-lucide="compass" class="w-4 h-4 text-emerald-500"></i>
                Tu Bitácora
            </h2>
            <div class="flex items-center gap-3">
                <span id="contador" class="text-xs font-bold bg-slate-100 text-slate-500 px-2 py-1 rounded-full">0</span>
                <!-- Botón CERRAR (Solo visible en móvil) -->
                <button onclick="toggleSidebar()" class="md:hidden p-1 hover:bg-slate-100 rounded-full text-slate-500">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
        
        <!-- Contenido Scrollable -->
        <div class="flex-1 overflow-y-auto p-2 space-y-2 bg-white rounded-b-2xl md:rounded-none" id="lista-lugares" role="list">
            <p class="text-slate-400 text-sm text-center mt-10 italic">Cargando datos...</p>
        </div>
    </aside>
    
    <!-- BACKDROP OSCURO PARA MÓVIL (Fondo detrás del popup) -->
    <div id="mobile-backdrop" onclick="toggleSidebar()" class="fixed inset-0 bg-black/40 z-[2999] hidden md:hidden backdrop-blur-sm transition-opacity"></div>

    <!-- ÁREA PRINCIPAL -->
    <main class="flex-1 relative h-full order-1">
        <nav class="absolute top-4 left-4 right-4 z-[1000] flex flex-col gap-4 pointer-events-none">
            
            <!-- Fila Superior: Botones y Buscador -->
            <div class="flex flex-col sm:flex-row justify-between items-start gap-3 w-full">
                
                <div class="flex gap-2 pointer-events-auto w-full sm:w-auto overflow-x-auto pb-1 sm:pb-0">
                    <!-- Botón Volver -->
                    <a href="/" class="bg-white/90 text-slate-800 p-3 rounded-full shadow-lg border border-slate-200 hover:text-emerald-600 transition-colors flex-shrink-0">
                        <i data-lucide="arrow-left" class="w-6 h-6"></i>
                    </a>

                    <!-- BOTÓN DE LISTA (SOLO MÓVIL) - NUEVO -->
                    <!-- Este botón abre el popup de la bitácora -->
                    <button onclick="toggleSidebar()" class="md:hidden bg-white/90 text-slate-800 p-3 rounded-full shadow-lg border border-slate-200 hover:text-emerald-600 transition-colors flex-shrink-0 relative">
                        <i data-lucide="list" class="w-6 h-6"></i>
                        <!-- Badge rojo si hay items -->
                        <span id="mobile-badge" class="absolute top-0 right-0 w-3 h-3 bg-red-500 rounded-full border-2 border-white hidden"></span>
                    </button>
                    
                    <!-- SWITCH DE MODO -->
                    <div class="bg-white/90 p-1 rounded-full shadow-lg border border-slate-200 flex items-center flex-shrink-0">
                        <button id="mode-point" onclick="setMode('point')" class="px-4 py-2 rounded-full text-sm font-bold flex items-center gap-2 transition-all bg-emerald-100 text-emerald-700 shadow-sm whitespace-nowrap">
                            <i data-lucide="map-pin" class="w-4 h-4"></i> Puntos
                        </button>
                        <button id="mode-route" onclick="setMode('route')" class="px-4 py-2 rounded-full text-sm font-bold flex items-center gap-2 transition-all text-slate-500 hover:bg-slate-100 whitespace-nowrap">
                            <i data-lucide="route" class="w-4 h-4"></i> Rutas
                        </button>
                    </div>
                </div>

                <!-- Buscador -->
                <div class="relative pointer-events-auto w-full max-w-md ml-auto group">
                    <div class="relative">
                        <input type="text" id="search-input" placeholder="Buscar lugar..." class="w-full pl-10 pr-4 py-3 rounded-full shadow-lg border-2 border-slate-200 focus:border-emerald-500 focus:outline-none bg-white/95 backdrop-blur-sm transition-all text-slate-700 text-sm" autocomplete="off">
                        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
                        <div id="search-loader" class="absolute right-3.5 top-3.5 hidden">
                            <i data-lucide="loader-2" class="w-4 h-4 text-emerald-500 animate-spin"></i>
                        </div>
                    </div>
                    <ul id="suggestions-list" class="absolute top-full left-0 right-0 mt-2 bg-white rounded-xl shadow-xl border border-slate-100 overflow-hidden hidden max-h-60 overflow-y-auto suggestions-list"></ul>
                </div>

            </div>
        </nav>

        <!-- Panel Flotante de Ruta -->
        <div id="route-panel" class="absolute bottom-8 left-4 right-4 md:left-auto md:right-4 md:bottom-8 md:w-80 bg-white p-4 rounded-xl shadow-2xl z-[1000] hidden pointer-events-auto border-l-4 border-emerald-500">
            <h3 class="font-bold text-slate-800 flex justify-between">
                Nueva EcoRuta
                <button onclick="cancelarRuta()" class="text-slate-400 hover:text-red-500"><i data-lucide="x" class="w-4 h-4"></i></button>
            </h3>
            <div class="mt-3 space-y-2 text-sm">
                <div class="flex items-center gap-2 text-slate-600"><div class="w-2 h-2 rounded-full bg-blue-500"></div> <span id="route-start">...</span></div>
                <div class="h-4 border-l-2 border-dashed border-slate-300 ml-1"></div>
                <div class="flex items-center gap-2 text-slate-600"><div class="w-2 h-2 rounded-full bg-emerald-500"></div> <span id="route-end">...</span></div>
            </div>
            <div class="mt-4 pt-4 border-t border-slate-100 flex justify-between items-center">
                <span id="route-dist" class="font-bold text-emerald-600 text-lg">0 km</span>
                <button onclick="guardarRuta()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-md hover:bg-emerald-700 flex gap-2">
                    <i data-lucide="save" class="w-4 h-4"></i> Guardar
                </button>
            </div>
        </div>

        <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 z-[2000] hidden bg-slate-800 text-white px-6 py-3 rounded-full shadow-xl flex items-center gap-3">
            <div id="toast-icon"></div>
            <span id="toast-message" class="font-medium text-sm"></span>
        </div>

        <div id="map" class="w-full h-full z-0"></div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

    <script>
        lucide.createIcons();
        var map = L.map('map', { zoomControl: false }).setView([32.5149, -117.0382], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap', maxZoom: 19 }).addTo(map);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // ESTADO
        var currentMode = 'point'; 
        var routePoints = []; 
        var routingControl = null;
        var activeRouteData = null;
        var tempMarker = null;

        // INICIALIZACIÓN
        fetch('/obtener_datos')
            .then(r => r.json())
            .then(datos => {
                document.getElementById('lista-lugares').innerHTML = '';
                if(datos.length === 0) document.getElementById('lista-lugares').innerHTML = '<p class="text-slate-400 text-sm text-center mt-10 italic">Sin datos.</p>';
                datos.forEach(d => agregarItemListaUI(d));
            })
            .catch(e => {
                console.error("Error cargando datos:", e);
                document.getElementById('lista-lugares').innerHTML = '<p class="text-red-400 text-sm text-center mt-10">Error de conexión. Asegúrate de ejecutar main.py</p>';
            });

        // --- UI MÓVIL: TOGGLE POPUP ---
        window.toggleSidebar = function() {
            // Solo aplica en móvil
            if (window.innerWidth >= 768) return; 

            const sidebar = document.getElementById('sidebar-container');
            const backdrop = document.getElementById('mobile-backdrop');
            
            // Si tiene la clase 'hidden', lo mostramos
            if (sidebar.classList.contains('hidden')) {
                sidebar.classList.remove('hidden');
                sidebar.classList.add('flex');
                backdrop.classList.remove('hidden');
            } else {
                sidebar.classList.add('hidden');
                sidebar.classList.remove('flex');
                backdrop.classList.add('hidden');
            }
        };

        // --- LÓGICA CENTRAL ---
        window.setMode = function(mode) {
            currentMode = mode;
            document.getElementById('mode-point').className = mode === 'point' ? "px-4 py-2 rounded-full text-sm font-bold flex items-center gap-2 transition-all bg-emerald-100 text-emerald-700 shadow-sm whitespace-nowrap" : "px-4 py-2 rounded-full text-sm font-bold flex items-center gap-2 transition-all text-slate-500 hover:bg-slate-100 whitespace-nowrap";
            document.getElementById('mode-route').className = mode === 'route' ? "px-4 py-2 rounded-full text-sm font-bold flex items-center gap-2 transition-all bg-blue-100 text-blue-700 shadow-sm whitespace-nowrap" : "px-4 py-2 rounded-full text-sm font-bold flex items-center gap-2 transition-all text-slate-500 hover:bg-slate-100 whitespace-nowrap";
            
            if(mode === 'point') cancelarRuta();
            else mostrarToast("Modo Ruta: Toca el mapa O usa tus puntos guardados", false);
        };

        map.on('click', function(e) {
            if (currentMode === 'point') manejarClicPunto(e.latlng);
            else manejarClicRuta(e.latlng);
        });

        function manejarClicPunto(latlng) {
            if (tempMarker) map.removeLayer(tempMarker);
            tempMarker = L.marker(latlng).addTo(map);
            var popupContent = `
                <div class="text-center p-1">
                    <p class="font-bold text-slate-700 mb-2">¿Nuevo Punto?</p>
                    <div class="flex gap-2 justify-center">
                        <button onclick="cancelarPunto()" class="px-3 py-1 text-xs font-bold text-slate-500 bg-slate-100 rounded">Cancelar</button>
                        <button onclick="guardarDato('punto', ${latlng.lat}, ${latlng.lng})" class="px-3 py-1 text-xs font-bold text-white bg-emerald-600 rounded shadow-md">Guardar</button>
                    </div>
                </div>`;
            tempMarker.bindPopup(popupContent).openPopup();
        }

        function manejarClicRuta(latlng) {
            if (routePoints.length >= 2) cancelarRuta();

            routePoints.push(latlng);
            L.circleMarker(latlng, { radius: 6, color: routePoints.length === 1 ? 'blue' : 'green', fillOpacity: 1 }).addTo(map);

            if (routePoints.length === 1) mostrarToast("Inicio fijado. Selecciona destino.", false);
            else if (routePoints.length === 2) {
                mostrarToast("Calculando ruta...", true);
                calcularRuta();
            }
        }

        function calcularRuta() {
            if (routingControl) map.removeControl(routingControl);
            routingControl = L.Routing.control({
                waypoints: routePoints,
                routeWhileDragging: false,
                addWaypoints: false,
                show: false,
                createMarker: function() { return null; },
                lineOptions: { styles: [{color: '#059669', opacity: 0.8, weight: 6}] }
            }).addTo(map);

            routingControl.on('routesfound', function(e) {
                var summary = e.routes[0].summary;
                var km = (summary.totalDistance / 1000).toFixed(2);
                document.getElementById('route-panel').classList.remove('hidden');
                document.getElementById('route-start').textContent = "Punto A";
                document.getElementById('route-end').textContent = "Punto B";
                document.getElementById('route-dist').textContent = `${km} km`;
                activeRouteData = { distancia: `${km} km`, origen: routePoints[0], destino: routePoints[1] };
                mostrarToast(`Ruta: ${km} km`, false, "success");
            });
            routingControl.on('routingerror', () => mostrarToast("Error: No se encontró ruta.", false, "error"));
        }

        function agregarItemListaUI(item) {
            const lista = document.getElementById('lista-lugares');
            const div = document.createElement('div');
            div.className = "p-3 rounded-lg border border-slate-100 hover:bg-slate-50 cursor-pointer transition-colors group mb-2";
            
            let icono = item.tipo === 'ruta' ? 'route' : 'map-pin';
            let color = item.tipo === 'ruta' ? 'text-blue-500' : 'text-emerald-500';
            let desc = item.tipo === 'ruta' ? `<span class="text-xs bg-slate-100 px-1 rounded">${item.distancia}</span>` : `<span class="text-xs text-slate-400">Lat: ${item.lat.toFixed(3)}</span>`;

            div.innerHTML = `
                <div class="flex justify-between items-start">
                    <div class="flex gap-3">
                        <i data-lucide="${icono}" class="w-5 h-5 ${color} mt-1"></i>
                        <div><h3 class="font-bold text-slate-700 text-sm">${item.nombre}</h3><div class="mt-1">${desc}</div></div>
                    </div>
                </div>`;
            
            div.onclick = () => {
                // Si estoy en móvil y toco un item, cierro el popup automáticamente
                if(window.innerWidth < 768) toggleSidebar();

                if (currentMode === 'route' && item.tipo === 'punto') {
                    mostrarToast(`Punto "${item.nombre}" agregado a la ruta`, false);
                    manejarClicRuta({ lat: item.lat, lng: item.lng });
                    map.panTo([item.lat, item.lng]);
                } else {
                    if(item.tipo === 'punto') map.flyTo([item.lat, item.lng], 16);
                    else if(item.tipo === 'ruta') map.flyTo([item.origen.lat, item.origen.lng], 14);
                }
            };
            lista.prepend(div);
            
            // Actualizar contadores
            const count = lista.children.length;
            document.getElementById('contador').textContent = count;
            if (count > 0) document.getElementById('mobile-badge').classList.remove('hidden');

            if (item.tipo === 'punto') {
                var marker = L.marker([item.lat, item.lng]).addTo(map);
                marker.on('click', function(e) {
                    if (currentMode === 'route') {
                        L.DomEvent.stopPropagation(e);
                        mostrarToast(`Usando "${item.nombre}" para ruta`, false);
                        manejarClicRuta(this.getLatLng());
                    } else {
                        this.bindPopup(`<b>${item.nombre}</b>`).openPopup();
                    }
                });
            }
            lucide.createIcons();
        }

        window.guardarDato = function(tipo, lat, lng) {
            let payload = { tipo: tipo };
            if (tipo === 'punto') { payload.lat = lat; payload.lng = lng; if(tempMarker) tempMarker.closePopup(); }
            else { payload = { ...payload, ...activeRouteData }; }

            mostrarToast("Guardando...", true);
            fetch('/guardar_dato', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(r => r.json())
            .then(data => {
                mostrarToast("¡Guardado!", false, "success");
                if(tipo === 'punto') { if(tempMarker) { map.removeLayer(tempMarker); tempMarker = null; } }
                else cancelarRuta();
                agregarItemListaUI(data.item);
            })
            .catch(e => mostrarToast("Error al guardar", false, "error"));
        };

        window.guardarRuta = () => guardarDato('ruta');
        window.cancelarPunto = () => { if(tempMarker) { map.removeLayer(tempMarker); tempMarker = null; } };
        window.cancelarRuta = () => {
            if(routingControl) { map.removeControl(routingControl); routingControl = null; }
            routePoints = []; activeRouteData = null;
            document.getElementById('route-panel').classList.add('hidden');
            map.eachLayer(l => { if(l instanceof L.CircleMarker) map.removeLayer(l); });
        };

        function mostrarToast(msg, loading, type="info") {
            const t = document.getElementById('toast');
            document.getElementById('toast-message').textContent = msg;
            const i = document.getElementById('toast-icon');
            t.classList.remove('hidden', 'toast-enter'); void t.offsetWidth; t.classList.add('toast-enter');
            
            if(loading) i.innerHTML = '<i data-lucide="loader-2" class="animate-spin w-5 h-5 text-emerald-400"></i>';
            else if(type==="success") i.innerHTML = '<i data-lucide="check-circle" class="w-5 h-5 text-emerald-400"></i>';
            else if(type==="error") i.innerHTML = '<i data-lucide="alert-circle" class="w-5 h-5 text-red-400"></i>';
            else i.innerHTML = '';
            
            if(!loading) setTimeout(() => t.classList.add('hidden'), 3000);
            lucide.createIcons();
        }

        // --- BUSCADOR ---
        const sInput = document.getElementById('search-input');
        const sList = document.getElementById('suggestions-list');
        const sLoader = document.getElementById('search-loader');
        let dTimer;

        sInput.addEventListener('input', function(e) {
            const q = e.target.value; clearTimeout(dTimer); sList.classList.add('hidden');
            if (q.length < 3) return;
            sLoader.classList.remove('hidden');
            dTimer = setTimeout(() => {
                fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=5&viewbox=-117.12,32.55,-116.85,32.45`)
                .then(r => r.json()).then(data => { sLoader.classList.add('hidden'); renderSugg(data); });
            }, 400);
        });

        function renderSugg(data) {
            sList.innerHTML = '';
            if(data.length===0) return;
            data.forEach(l => {
                let li = document.createElement('li');
                li.className = "px-4 py-3 hover:bg-slate-50 cursor-pointer border-b text-sm text-slate-700 flex gap-3";
                li.innerHTML = `<i data-lucide="map-pin" class="w-4 h-4 text-slate-400"></i> <span>${l.display_name.split(',')[0]}</span>`;
                li.onclick = () => {
                    sList.classList.add('hidden');
                    const latlng = {lat: parseFloat(l.lat), lng: parseFloat(l.lon)};
                    map.setView(latlng, 15);
                    if(currentMode === 'point') manejarClicPunto(latlng);
                    else manejarClicRuta(latlng);
                };
                sList.appendChild(li);
            });
            sList.classList.remove('hidden');
            lucide.createIcons();
        }
        document.addEventListener('click', e => { if (!sInput.contains(e.target) && !sList.contains(e.target)) sList.classList.add('hidden'); });

    </script>
</body>
</html>
