<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorar - MapStar TJ</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        .leaflet-touch .leaflet-bar a {
            width: 44px; height: 44px; line-height: 44px;
            color: #1e293b; background-color: white;
        }
        @keyframes slideUp {
            from { transform: translate(-50%, 100%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
        .toast-enter { animation: slideUp 0.3s ease-out forwards; }
        
        /* Estilo para item de lista activo */
        .list-item-active { border-left: 4px solid #10b981; background-color: #f0fdf4; }
    </style>
</head>
<body class="bg-slate-100 h-screen flex flex-col md:flex-row overflow-hidden">

    <!-- 1. BARRA LATERAL (LISTA) - Accesibilidad: Alternativa textual al mapa -->
    <aside class="w-full md:w-80 bg-white border-r border-slate-200 flex flex-col z-20 shadow-xl md:shadow-none h-1/3 md:h-full order-2 md:order-1">
        <div class="p-4 border-b border-slate-100 flex items-center justify-between">
            <h2 class="font-bold text-slate-800 flex items-center gap-2">
                <i data-lucide="list" class="w-4 h-4 text-emerald-500"></i>
                Lugares Guardados
            </h2>
            <span id="contador" class="text-xs font-bold bg-slate-100 text-slate-500 px-2 py-1 rounded-full">0</span>
        </div>
        
        <!-- Lista Scrollable -->
        <div class="flex-1 overflow-y-auto p-2 space-y-2" id="lista-lugares" role="list" aria-label="Lista de marcadores en el mapa">
            <p class="text-slate-400 text-sm text-center mt-10 italic">No hay puntos guardados aún.</p>
        </div>
    </aside>

    <!-- 2. ÁREA PRINCIPAL (MAPA) -->
    <main class="flex-1 relative h-2/3 md:h-full order-1 md:order-2">
        <!-- Navbar Flotante -->
        <nav class="absolute top-4 left-4 right-4 z-[1000] flex justify-between items-center pointer-events-none">
            <a href="/" aria-label="Volver al inicio" class="pointer-events-auto bg-white/90 text-slate-800 p-3 rounded-full shadow-lg backdrop-blur-md border border-slate-200 hover:text-emerald-600 transition-colors focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                <i data-lucide="arrow-left" class="w-6 h-6"></i>
            </a>
            <div class="pointer-events-auto bg-white/90 px-4 py-2 rounded-full shadow-lg backdrop-blur-md border border-slate-200">
                <span class="text-slate-800 font-bold tracking-wide">MapStar</span> 
            </div>
            <div class="w-12"></div>
        </nav>

        <!-- Toast -->
        <div id="toast" class="fixed bottom-8 left-1/2 md:left-[60%] -translate-x-1/2 z-[2000] hidden bg-slate-800 text-white px-6 py-3 rounded-full shadow-xl flex items-center gap-3" role="alert" aria-live="assertive">
            <div id="toast-icon"><i data-lucide="loader-2" class="animate-spin w-5 h-5 text-emerald-400"></i></div>
            <span id="toast-message" class="font-medium text-sm">Procesando...</span>
        </div>

        <div id="map" class="w-full h-full z-0" role="application" aria-label="Mapa interactivo de Tijuana"></div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        lucide.createIcons();

        var map = L.map('map', { zoomControl: false }).setView([32.5149, -117.0382], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        // Accesibilidad: Botones de zoom con aria-label
        var zoomControl = L.control.zoom({ position: 'bottomright' }).addTo(map);
        // Nota: Leaflet añade aria-label por defecto en versiones recientes, pero verificamos visualmente su posición.

        var tempMarker = null;
        var markers = {}; // Diccionario para guardar referencias a los marcadores reales

        // Cargar puntos existentes al inicio
        fetch('/obtener_puntos')
            .then(r => r.json())
            .then(puntos => {
                if(puntos.length > 0) document.getElementById('lista-lugares').innerHTML = '';
                puntos.forEach(p => agregarPuntoUI(p));
            });

        map.on('click', function(e) {
            if (tempMarker) map.removeLayer(tempMarker);
            var lat = e.latlng.lat;
            var lng = e.latlng.lng;
            tempMarker = L.marker([lat, lng]).addTo(map);
            
            var popupContent = `
                <div class="text-center p-1">
                    <p class="font-bold text-slate-700 mb-2">¿Nuevo punto?</p>
                    <div class="flex gap-2 justify-center">
                        <button onclick="cancelarPunto()" aria-label="Cancelar marcado" class="px-3 py-1 text-xs font-bold text-slate-500 bg-slate-100 rounded hover:bg-slate-200 focus:ring-2 focus:ring-slate-400">Cancelar</button>
                        <button onclick="guardarPunto(${lat}, ${lng})" aria-label="Confirmar guardar punto" class="px-3 py-1 text-xs font-bold text-white bg-emerald-600 rounded hover:bg-emerald-700 shadow-md focus:ring-2 focus:ring-emerald-500">Guardar</button>
                    </div>
                </div>
            `;
            tempMarker.bindPopup(popupContent).openPopup();
        });

        window.guardarPunto = function(lat, lng) {
            tempMarker.closePopup();
            mostrarToast("Guardando ubicación...", true);

            fetch('/guardar_punto', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ lat: lat, lng: lng })
            })
            .then(response => response.json())
            .then(data => {
                if(data.status === 'success') {
                    mostrarToast("¡Guardado en la lista!", false, "success");
                    map.removeLayer(tempMarker); // Quitamos el temporal
                    tempMarker = null;
                    agregarPuntoUI(data.punto); // Agregamos el definitivo a Mapa y Lista
                }
            })
            .catch(error => mostrarToast("Error al guardar", false, "error"));
        };

        window.cancelarPunto = function() {
            if (tempMarker) {
                map.removeLayer(tempMarker);
                tempMarker = null;
            }
        };

        // Función central para agregar puntos a la UI (Mapa + Lista)
        function agregarPuntoUI(punto) {
            // 1. Agregar al Mapa
            var marker = L.marker([punto.lat, punto.lng]).addTo(map);
            marker.bindPopup(`<b>${punto.nombre}</b><br>Lat: ${punto.lat.toFixed(4)}`);
            markers[punto.id] = marker; // Guardar referencia

            // 2. Agregar a la Lista (Accesibilidad)
            const lista = document.getElementById('lista-lugares');
            
            // Si es el primer elemento, limpiar el mensaje de "vacio"
            if (lista.children[0]?.tagName === 'P') lista.innerHTML = '';

            const item = document.createElement('div');
            item.className = "p-3 rounded-lg border border-slate-100 hover:bg-slate-50 cursor-pointer transition-colors group focus:outline-none focus:ring-2 focus:ring-emerald-500";
            item.setAttribute('role', 'button');
            item.setAttribute('tabindex', '0'); // Accesible vía teclado
            item.setAttribute('aria-label', `Ir a ${punto.nombre}`);
            
            item.innerHTML = `
                <div class="flex justify-between items-start">
                    <div>
                        <h3 class="font-bold text-slate-700 text-sm group-hover:text-emerald-600">${punto.nombre}</h3>
                        <p class="text-xs text-slate-400 mt-1">Lat: ${punto.lat.toFixed(4)}, Lng: ${punto.lng.toFixed(4)}</p>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-slate-300"></i>
                </div>
            `;

            // Evento: Clic en lista -> Volar en mapa
            item.onclick = () => enfocarPunto(punto.id, punto.lat, punto.lng, item);
            // Accesibilidad teclado (Enter)
            item.onkeypress = (e) => { if(e.key === 'Enter') enfocarPunto(punto.id, punto.lat, punto.lng, item); };

            lista.prepend(item); // Agregar al principio
            
            // Actualizar contador
            document.getElementById('contador').textContent = Object.keys(markers).length;
            lucide.createIcons();
        }

        function enfocarPunto(id, lat, lng, itemElement) {
            // FlyTo animation
            map.flyTo([lat, lng], 16, { duration: 1.5 });
            
            // Abrir popup
            markers[id].openPopup();

            // Highlight visual en la lista
            document.querySelectorAll('#lista-lugares > div').forEach(el => el.classList.remove('list-item-active'));
            itemElement.classList.add('list-item-active');
        }

        function mostrarToast(mensaje, isLoading, type = "info") {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = mensaje;
            const iconEl = document.getElementById('toast-icon');
            
            toast.classList.remove('hidden', 'toast-enter');
            void toast.offsetWidth; // Trigger reflow
            toast.classList.add('toast-enter');

            if (isLoading) iconEl.innerHTML = '<i data-lucide="loader-2" class="animate-spin w-5 h-5 text-emerald-400"></i>';
            else if (type === "success") {
                iconEl.innerHTML = '<i data-lucide="check-circle" class="w-5 h-5 text-emerald-400"></i>';
                setTimeout(() => toast.classList.add('hidden'), 3000);
            } else {
                iconEl.innerHTML = '<i data-lucide="alert-circle" class="w-5 h-5 text-red-400"></i>';
                setTimeout(() => toast.classList.add('hidden'), 3000);
            }
            lucide.createIcons();
        }
    </script>
</body>
</html>
